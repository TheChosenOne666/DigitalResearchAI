name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        run: pnpm --filter @app/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build
